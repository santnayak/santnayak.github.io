<a class="entry" href="{{ include.post.url | relative_url }}">
  <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: '%b %d, %Y' }}</time>
  <div><span class="entry-category">{{ include.post.category | default: 'Journal' | escape }}</span><h3>{{ include.post.title | escape }}</h3>{% if include.post.description %}<p>{{ include.post.description | escape }}</p>{% endif %}</div>
  <span class="entry-arrow" aria-hidden="true">↗</span>
</a>
