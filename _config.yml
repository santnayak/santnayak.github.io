title: Santhosh Nayak
description: Backend systems, AI agents, and notes along the way.
url: https://santnayak.github.io
baseurl: ""
markdown: kramdown
permalink: /journal/:year/:month/:day/:title/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: post
exclude:
  - vendor
  - README.md
  - templates
  - Gemfile
  - Gemfile.lock
