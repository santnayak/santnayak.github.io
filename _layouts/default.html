<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f4">
  {% seo %}
  {% feed_meta %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Santhosh Nayak home">Santhosh Nayak</a>
      <nav aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/projects/' | relative_url }}" {% if page.url contains '/projects/' %}aria-current="page"{% endif %}>Projects</a>
        <a href="{{ '/journal/' | relative_url }}" {% if page.url contains '/journal/' or page.url contains '/blog/' %}aria-current="page"{% endif %}>Journal</a>
      </nav>
    </header>
    <main id="main">{{ content }}</main>
    <footer class="site-footer"><span>© {{ site.time | date: '%Y' }} Santhosh Nayak</span><span><a href="https://github.com/santnayak">GitHub ↗</a><a href="{{ '/feed.xml' | relative_url }}">RSS ↗</a></span></footer>
  </div>
</body>
</html>
